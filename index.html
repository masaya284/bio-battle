<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>生物一問一答バトル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 1カラムのスマホアプリ。上に科目タブ、中央に問題カード。色はH-E染色（ヘマトキシリンの青紫・エオシンの桃）から */
:root{
  --bg:#f2f1f6; --surface:#ffffff; --sunk:#e8e6f0; --ink:#1d1830; --muted:#625b78; --line:#d9d5e5;
  --hema:#43308f; --hema-ink:#ffffff; --eosin:#c93a6e; --eosin-soft:#f8e3ec;
  --ok:#11795c; --ok-soft:#dcf1ea; --ng:#b8432a; --ng-soft:#f8e4de;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14111d; --surface:#1e1a2a; --sunk:#282337; --ink:#eeebf6; --muted:#a69fbd; --line:#363049;
  --hema:#a896f0; --hema-ink:#14111d; --eosin:#f27ba7; --eosin-soft:#3a2131;
  --ok:#43c99e; --ok-soft:#173329; --ng:#f08a6e; --ng-soft:#3a221c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14111d; --surface:#1e1a2a; --sunk:#282337; --ink:#eeebf6; --muted:#a69fbd; --line:#363049;
  --hema:#a896f0; --hema-ink:#14111d; --eosin:#f27ba7; --eosin-soft:#3a2131;
  --ok:#43c99e; --ok-soft:#173329; --ng:#f08a6e; --ng-soft:#3a221c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;-webkit-tap-highlight-color:transparent}
.wrap{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:12px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--eosin);outline-offset:2px}
.top{display:flex;flex-direction:column;gap:12px;padding-block:8px 16px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:1.45rem;margin:0;letter-spacing:.02em;line-height:1.2}
.brand h1 b{color:var(--eosin);font-weight:400}
.brand span{font-size:.8rem;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:999px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;padding:9px 4px;border-radius:999px;font-weight:700;font-size:.95rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
h2{font-size:.78rem;letter-spacing:.12em;color:var(--muted);margin:0;font-weight:700}
.stack{display:flex;flex-direction:column;gap:20px}
.sect{display:flex;flex-direction:column;gap:10px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fchip{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.fchip b{font-size:.95rem;line-height:1.35}
.fchip small{font-size:.72rem;color:var(--muted)}
.fchip[aria-pressed="true"]{border-color:var(--hema);background:color-mix(in srgb,var(--hema) 9%,var(--surface))}
.fchip[aria-pressed="true"] b::before{content:"✓ ";color:var(--hema)}
.linkrow{display:flex;gap:16px}
.link{border:0;background:none;color:var(--hema);font-weight:700;font-size:.85rem;padding:2px 0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;border:1.5px solid var(--line);background:var(--surface);padding:9px 8px;border-radius:10px;font-weight:700;font-size:.92rem}
.seg button[aria-pressed="true"]{border-color:var(--hema);color:var(--hema);background:color-mix(in srgb,var(--hema) 9%,var(--surface))}
.primary{border:0;background:var(--hema);color:var(--hema-ink);font-weight:700;font-size:1.05rem;padding:14px;border-radius:var(--r);width:100%}
.primary:disabled{opacity:.4;cursor:not-allowed}
.secondary{border:1.5px solid var(--line);background:var(--surface);font-weight:700;padding:12px;border-radius:var(--r);width:100%}
.ghost{border:0;background:none;color:var(--muted);font-size:.85rem;padding:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.note{font-size:.8rem;color:var(--muted);margin:0}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:.75rem;font-weight:700;color:var(--hema);background:color-mix(in srgb,var(--hema) 12%,transparent);padding:3px 10px;border-radius:999px}
.num{font-family:var(--f-num);font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--hema);border-radius:6px;transition:width .3s}
.bar.timer i{background:var(--eosin);transition:none}
.qtext{font-size:1.12rem;font-weight:500;margin:0;line-height:1.75;text-wrap:pretty}
.choices{display:flex;flex-direction:column;gap:8px}
.ch{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:1rem;line-height:1.5}
.ch .mk{font-family:var(--f-num);font-weight:600;color:var(--muted);flex:none;width:1.2em}
.ch span:last-child{min-width:0}
.ch:not(:disabled):active{transform:scale(.99)}
.ch:disabled{cursor:default}
.ch.ok{border-color:var(--ok);background:var(--ok-soft)}
.ch.ok .mk{color:var(--ok)}
.ch.ng{border-color:var(--ng);background:var(--ng-soft)}
.ch.ng .mk{color:var(--ng)}
.ch.picked{border-color:var(--hema);background:color-mix(in srgb,var(--hema) 10%,var(--surface))}
.ch.dim{opacity:.55}
.exp{border-radius:12px;padding:12px 14px;font-size:.92rem;display:flex;flex-direction:column;gap:4px}
.exp.ok{background:var(--ok-soft)} .exp.ng{background:var(--ng-soft)}
.exp b{font-size:1rem}
.exp .crowd{font-size:.75rem;color:var(--muted);border-top:1px solid color-mix(in srgb,var(--ink) 12%,transparent);padding-top:6px;margin-top:4px}
.exp.ok b{color:var(--ok)} .exp.ng b{color:var(--ng)}
.big{font-family:var(--f-display);font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-family:var(--f-body);font-size:1rem;color:var(--muted);margin-left:4px}
.wrong{display:flex;flex-direction:column;gap:10px}
.wrong li{list-style:none;border-top:1px solid var(--line);padding-top:10px;font-size:.9rem}
.wrong ul{margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.wrong .ans{color:var(--ok);font-weight:700}
/* stats */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--f-num);font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:.72rem;color:var(--muted)}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.frow:first-child{border-top:0}
.frow .nm{font-weight:700;font-size:.92rem}
.frow .nm small{font-weight:400;color:var(--muted);font-size:.72rem;margin-left:6px}
.frow .pc{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.frow .meter{grid-column:1/-1;height:8px;background:var(--sunk);border-radius:8px;overflow:hidden;display:flex}
.frow .meter i{display:block;height:100%}
.frow .meter .a{background:var(--hema)} .frow .meter .b{background:color-mix(in srgb,var(--hema) 30%,var(--sunk))}
.frow .sub{grid-column:1/-1;font-size:.72rem;color:var(--muted)}
.pc.low{color:var(--ng)}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.on::before{background:var(--ok)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem}
.confirm button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:700}
.confirm .danger{border-color:var(--ng);color:var(--ng)}
/* battle */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.8rem;font-weight:700;color:var(--muted)}
input[type=text],input[inputmode]{font:inherit;font-size:1.05rem;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
.joinrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.joinrow button{border:0;background:var(--eosin);color:#fff;font-weight:700;border-radius:12px;padding:0 18px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.codebox{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--eosin-soft);border-radius:var(--r);padding:14px 18px}
.codebox span{font-size:.8rem;font-weight:700;color:var(--eosin)}
.codebox b{font-family:var(--f-num);font-size:2rem;letter-spacing:.18em;color:var(--eosin);font-variant-numeric:tabular-nums}
.players{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.players li{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.88rem;font-weight:500}
.players li.host{border-color:var(--eosin)}
.players li em{font-style:normal;color:var(--muted);font-size:.75rem;margin-left:4px}
.waiting{font-size:.88rem;color:var(--muted);text-align:center;padding:8px}
.rank{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.rank li{display:grid;grid-template-columns:2em minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:.92rem}
.rank li:first-child{border-top:0}
.rank .pos{font-family:var(--f-num);font-weight:600;color:var(--muted)}
.rank .who{overflow-wrap:anywhere}
.rank .t{font-family:var(--f-num);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.rank .pt{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums;text-align:right;min-width:3.2em}
.rank .mark{font-weight:700;margin-right:6px}
.rank .mark.o{color:var(--ok)} .rank .mark.x{color:var(--ng)}
.rank li.me{background:color-mix(in srgb,var(--hema) 7%,transparent);border-radius:8px}
.podium .big{color:var(--eosin)}
.err{color:var(--ng);font-size:.85rem;margin:0}
.course{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.course button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;font-weight:700;font-size:.92rem;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.3}
.course button small{font-weight:400;font-size:.7rem;color:var(--muted)}
.course button[aria-selected="true"]{background:var(--hema);border-color:var(--hema);color:var(--hema-ink)}
.course button[aria-selected="true"] small{color:inherit;opacity:.8}
.st{color:var(--eosin);letter-spacing:-.05em;font-size:.8em;margin-left:6px}
.st .off{color:var(--line)}
.lvseg button{display:flex;flex-direction:column;align-items:center;line-height:1.35}
.lvseg button .st{margin-left:0}
.lvseg button small{font-weight:400;font-size:.7rem;color:var(--muted)}
.lvkpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvkpi div{display:flex;flex-direction:column;gap:2px;min-width:0}
.lvkpi .st{margin-left:0}
.lvkpi b{font-family:var(--f-num);font-size:1.3rem;font-variant-numeric:tabular-nums}
.lvkpi b.low{color:var(--ng)}
.lvkpi span:last-child{font-size:.72rem;color:var(--muted)}
.qimg{margin:0;border-radius:var(--r);overflow:hidden;background:var(--sunk);display:flex;justify-content:center}
.qimg img{display:block;max-width:100%;max-height:52vh;object-fit:contain}
.drop{display:flex;align-items:center;justify-content:center;min-height:160px;border:2px dashed var(--line);border-radius:var(--r);background:var(--sunk);cursor:pointer;overflow:hidden;color:var(--hema);font-weight:700}
.drop img{display:block;max-width:100%;max-height:300px;object-fit:contain}
textarea{font:inherit;font-size:1rem;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);width:100%;resize:vertical}
.field input + input{margin-top:6px}
.phlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.phlist li{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center}
.phlist img{width:56px;height:56px;object-fit:cover;border-radius:10px;background:var(--sunk)}
.phlist b{display:block;font-size:.95rem}
.phlist small{display:block;font-size:.72rem;color:var(--muted);overflow-wrap:anywhere}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:10px;float:right;margin-left:10px}
.oni{display:inline-block;font-family:var(--f-display);font-size:.85em;color:#fff;background:#8f1d2c;border-radius:4px;padding:0 4px;letter-spacing:0;line-height:1.35}
.lvseg button.lv-oni[aria-pressed="true"]{border-color:#8f1d2c;color:#8f1d2c;background:color-mix(in srgb,#8f1d2c 10%,var(--surface))}
.oni-mode .brand h1 b{color:#b3263a}
.brand h1 b{cursor:default;-webkit-user-select:none;user-select:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;font-size:.9rem;box-shadow:0 6px 24px rgb(0 0 0 / .25);transition:opacity .4s,transform .4s;z-index:10;text-align:center}
.toast.oni{background:#8f1d2c;color:#fff}
.toast.out{opacity:0;transform:translateX(-50%) translateY(8px)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<script>
/* 独立サイト版：claude.ai のページ機能（room / db / user / assets）を Firebase で置き換える */
(function () {
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey || String(cfg.apiKey).includes('ここに') || !window.firebase) {
    window.APP_ENV = 'site-offline';
    window.claude = {use: async () => null};
    return;
  }
  window.APP_ENV = 'site';
  firebase.initializeApp(cfg);
  const auth = firebase.auth(), rdb = firebase.database();
  const TS = firebase.database.ServerValue.TIMESTAMP;
  const ready = Promise.race([
    new Promise(res => {
      auth.onAuthStateChanged(u => { if (u) res(u); });
      auth.signInAnonymously().catch(e => { console.warn('匿名ログインに失敗', e); res(null); });
    }),
    new Promise(res => setTimeout(() => res(null), 10000))
  ]);
  const uid = async () => { const u = await ready; return u ? u.uid : null; };
  const rand = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join('');

  /* ---- 接続状態 ---- */
  let connected = false;
  const connHs = new Set();
  rdb.ref('.info/connected').on('value', s => { connected = !!s.val(); for (const h of connHs) h(connected); });

  /* ---- db ---- */
  const LSK = 'bio-site-userdoc';
  function userDoc() { // 個人の記録はこのブラウザに保存（サーバーには送らない）
    return {
      id: 'stats',
      async get() { let v = null; try { v = JSON.parse(localStorage.getItem(LSK)); } catch (e) {} return {id: 'stats', exists: !!v, data: () => v || undefined, metadata: {}}; },
      async set(d) { try { localStorage.setItem(LSK, JSON.stringify(d)); } catch (e) {} },
      async update(d) { const s = await this.get(); await this.set(Object.assign({}, s.data() || {}, d)); },
      async delete() { try { localStorage.removeItem(LSK); } catch (e) {} }
    };
  }
  const docsOf = val => Object.entries(val || {}).map(([id, x]) => ({id, exists: true, data: () => x, metadata: {}}));
  function coll(path) {
    if (/^data\/users\/[^/]+$/.test(path)) return {doc: () => userDoc(), onSnapshot: (n) => { setTimeout(() => n({docs: [], size: 0, empty: true}), 0); return () => {}; }};
    if (path !== 'photoq' && path !== 'agg') throw new Error('unknown collection ' + path);
    const ref = rdb.ref(path);
    return {
      onSnapshot(next, err) {
        const cb = s => { const docs = docsOf(s.val()); next({docs, size: docs.length, empty: !docs.length, metadata: {}}); };
        ref.on('value', cb, e => err && err({code: 'upstream_error', message: String(e)}));
        return () => ref.off('value', cb);
      },
      async add(data) { const r = ref.push(); await r.set(data); return {id: r.key}; },
      doc(id) {
        const r = ref.child(id);
        return {
          id,
          async get() { const s = await r.once('value'); return {id, exists: s.exists(), data: () => s.val() || undefined, metadata: {}}; },
          async set(d) { await r.set(d); },
          async update(d) { await r.update(d); },
          async delete() { await r.remove(); }
        };
      }
    };
  }
  const db = Object.freeze({collection: coll});

  /* ---- 写真（assets）：画像はデータURLとして blobs/<id> に保存 ---- */
  const cache = {}, loading = {};
  const BLANK = 'data:image/gif;base64,R0lGODlhAQABAAAAACw=';
  function loadBlob(id) {
    if (cache[id] || loading[id]) return;
    loading[id] = rdb.ref('blobs/' + id).once('value').then(s => {
      const v = s.val();
      if (typeof v === 'string' && v.startsWith('data:image/')) {
        cache[id] = v;
        document.querySelectorAll('img[data-blob="' + id + '"]').forEach(img => { img.src = v; });
      }
    }).catch(() => {}).finally(() => { delete loading[id]; });
  }
  window.BLOB = {src: id => { if (cache[id]) return cache[id]; loadBlob(id); return BLANK; }};
  new MutationObserver(() => {
    document.querySelectorAll('img[data-blob]').forEach(img => {
      const id = img.dataset.blob;
      if (cache[id]) { if (img.src !== cache[id]) img.src = cache[id]; } else loadBlob(id);
    });
  }).observe(document.documentElement, {childList: true, subtree: true});
  async function toDataURL(blob) {
    try {
      const bmp = await createImageBitmap(blob);
      const s = Math.min(1, 960 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      return c.toDataURL('image/jpeg', 0.78);
    } catch (e) { throw {code: 'unsupported_type', message: '画像を読み込めません'}; }
  }
  const assets = Object.freeze({
    async upload(blob) {
      const url = await toDataURL(blob);
      if (url.length > 390000) throw {code: 'too_large', message: '画像が大きすぎます'};
      const id = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
      await rdb.ref('blobs/' + id).set(url).catch(e => { throw {code: 'not_granted', message: String(e)}; });
      cache[id] = url;
      return {id, url, sizeBytes: url.length, contentType: 'image/jpeg'};
    },
    async delete(id) { await rdb.ref('blobs/' + id).remove(); delete cache[id]; },
    async list() { return {assets: [], usage: {}}; }
  });
  async function isAdmin() {
    const id = await uid(); if (!id) return false;
    try { return (await rdb.ref('admins/' + id).once('value')).exists(); } catch (e) { return false; }
  }

  /* ---- user ---- */
  const user = Object.freeze({
    id: uid,
    me: async () => ({id: await uid(), name: '', guest: false}),
    isOwner: async () => false,
    canEdit: async () => isAdmin(),
    can: async () => null,
    profiles: async ids => Object.fromEntries((ids || []).map(i => [i, {id: i, name: ''}]))
  });

  /* ---- room：rooms/<名前>/peers/<ピア>/{p: presence, by: uid, t} ---- */
  function makeRoom(name, myUid) {
    const myPeer = rand(16);
    const ref = rdb.ref('rooms/' + name + '/peers'), me = ref.child(myPeer);
    let pres = {}, peers = Object.freeze([]), prev = new Map(), alive = true;
    const hs = new Set();
    const write = () => { me.onDisconnect().remove(); return me.set({p: pres, by: myUid, t: TS}); };
    const onVal = s => {
      const val = s.val() || {}, now = Date.now(), map = new Map(), joined = [], updated = [], left = [], list = [];
      for (const [pid, x] of Object.entries(val)) {
        if (!x || typeof x !== 'object') continue;
        const j = JSON.stringify(x.p || {}), old = prev.get(pid);
        let peer = old;
        if (!old || old._j !== j) {
          peer = Object.freeze({peer: pid, by: x.by || null, isMe: x.by === myUid, sameTab: pid === myPeer, kind: 'viewer', guest: false,
            presence: Object.freeze(x.p || {}), updatedAt: now, _j: j});
          (old ? updated : joined).push(peer);
        }
        map.set(pid, peer); list.push(peer);
      }
      for (const [pid, p] of prev) if (!map.has(pid)) left.push(p);
      prev = map; peers = Object.freeze(list);
      for (const h of hs) { try { h({peers, joined, left, updated}); } catch (e) { console.error(e); } }
    };
    const onConn = c => { if (c && alive) write().catch(() => {}); };
    return {
      name,
      async _init() { await write(); ref.on('value', onVal); connHs.add(onConn); },
      async presence(patch) {
        if (!alive) throw {code: 'invalid_argument', message: 'left'};
        const nextP = Object.assign({}, pres);
        for (const [k, v] of Object.entries(patch || {})) { if (v === null) delete nextP[k]; else nextP[k] = v; }
        if (new Blob([JSON.stringify(nextP)]).size > 4096) throw {code: 'invalid_argument', message: 'presence too large'};
        pres = nextP;
        await write();
      },
      peers: () => peers,
      onPeers(h) { hs.add(h); setTimeout(() => { if (hs.has(h)) h({peers, joined: peers, left: [], updated: []}); }, 0); return () => hs.delete(h); },
      connected: () => connected,
      onConnection(h) { connHs.add(h); setTimeout(() => h(connected), 0); return () => connHs.delete(h); },
      emit: async () => {},
      on: () => () => {},
      async leave() {
        if (!alive) return; alive = false;
        ref.off('value', onVal); connHs.delete(onConn); hs.clear();
        try { await me.onDisconnect().cancel(); await me.remove(); } catch (e) {}
      }
    };
  }
  const joined = new Map();
  const room = Object.freeze({
    async join(name) {
      if (!/^[a-z0-9][a-z0-9_.-]{0,47}$/.test(name)) throw {code: 'invalid_argument', message: 'room name'};
      const id = await uid(); if (!id) throw {code: 'not_permitted', message: 'サーバーにログインできません'};
      if (joined.has(name)) return joined.get(name);
      const r = makeRoom(name, id);
      try { await r._init(); } catch (e) { throw {code: 'upstream_error', message: String(e)}; }
      const leave = r.leave; r.leave = async () => { joined.delete(name); await leave(); };
      joined.set(name, r);
      return r;
    },
    connected: () => connected
  });

  window.claude = {
    use: async name => {
      if (name === 'db') return db;
      if (name === 'user') return user;
      if (name === 'room') return room;
      if (name === 'assets') return (await isAdmin()) ? assets : null;
      return null;
    }
  };
})();

</script>

 ['ショウジョウバエで、触角が生じるべき位置に脚が生じる突然変異の原因となる遺伝子の総称はどれか。', ['ホメオティック遺伝子','ペアルール遺伝子','ギャップ遺伝子','母性効果遺伝子'], 'アンテナペディア突然変異。ホメオティック遺伝子は各体節の構造を決める調節遺伝子。'],

 ['ニワトリ胚の肢芽の前方側に、後方側の極性化活性帯（ZPA）を移植した。生じる翼の指の並びとして最も適当なものはどれか。', ['正常な指の並びが鏡像対称に重複する','指がすべて失われる','指の数は変わらず、並び順が逆になるだけ','移植片から脚が生じる'], 'ZPAはソニックヘッジホッグ（Shh）を分泌し、その濃度勾配が前後軸の位置情報となる。前方にも高濃度域ができるため鏡像重複が起こる。', 4],
 ['カエル胚で、β-カテニンが核に蓄積し、形成体の形成につながるのはどの領域か。', ['将来の背側','将来の腹側','動物極','植物極の中心'], '受精後の表層回転によって背側に運ばれた因子がβ-カテニンの分解を防ぐ。背側で核に入ったβ-カテニンが背側の遺伝子発現を誘導する。', 4],
 ['AaBbを検定交雑すると、[AB]：[Ab]：[aB]：[ab]＝1：4：4：1となった。AaBbでの遺伝子の連鎖のしかたと組換え価の組み合わせとして正しいものはどれか。', ['Aとb・aとBが連鎖、組換え価20％','AとB・aとbが連鎖、組換え価20％','Aとb・aとBが連鎖、組換え価80％','独立、組換え価50％'], '多いのはAbとaBなので、これらが親の組み合わせ（相反）。少ないABとabが組換え型で(1＋1)/10＝20％。', 4],

 ['体細胞分裂で、染色体が赤道面に並ぶのはどの時期か。', ['中期','前期','後期','終期'], '後期に染色体が縦裂面で分かれて両極へ移動する。', 1],

body: [

 ['インスリンを分泌する細胞はどれか。', ['すい臓ランゲルハンス島のB細胞','すい臓ランゲルハンス島のA細胞','副腎髄質の細胞','脳下垂体前葉の細胞'], 'A細胞はグルカゴンを分泌する。'],
 ['体液の浸透圧が上昇したとき脳下垂体後葉から分泌され、集合管での水の再吸収を促進するホルモンはどれか。', ['バソプレシン','鉱質コルチコイド','チロキシン','パラトルモン'], '視床下部の神経分泌細胞で合成され、後葉から分泌される。'],
 ['チロキシンが過剰になると、視床下部や脳下垂体前葉からのホルモン分泌が抑えられる。このしくみを何というか。', ['負のフィードバック','正のフィードバック','拮抗作用','神経分泌'], '最終産物が上位の分泌を抑えることで、ホルモン濃度が一定範囲に保たれる。'],
 ['腎臓で原尿がつくられるのはどこか。', ['糸球体からボーマンのう','細尿管（腎細管）','集合管','腎う'], '血液中の血球やタンパク質以外の成分が、糸球体からボーマンのうへろ過される。'],
 ['健康なヒトで、原尿には含まれるが尿にはほとんど含まれない物質はどれか。', ['グルコース','尿素','タンパク質','血球'], 'グルコースは細尿管でほぼすべて再吸収される。タンパク質と血球はそもそもろ過されない。'],
 ['尿量が1日1.5L、イヌリンの濃縮率が120のとき、1日の原尿量はいくらか。イヌリンは再吸収されない。', ['180L','120L','1.5L','12.5L'], 'イヌリンはろ過されたあと再吸収されないので、原尿量＝尿量×濃縮率＝1.5×120＝180L。'],

 ['取り込んだ抗原の情報をT細胞に提示し、獲得免疫を始動させる働きが特に強い細胞はどれか。', ['樹状細胞','好中球','赤血球','血小板'], '樹状細胞はリンパ節へ移動し、抗原をMHC分子にのせてT細胞に提示する。'],
 ['ウイルスに感染した細胞を直接攻撃して排除する細胞はどれか。', ['キラーT細胞','B細胞','ヘルパーT細胞','形質細胞'], '細胞性免疫の中心。ヘルパーT細胞はキラーT細胞やB細胞を活性化する。'],
 ['予防接種が利用している免疫のしくみはどれか。', ['免疫記憶による二次応答','アレルギー','自己免疫','免疫寛容'], '記憶細胞が残るため、同じ抗原が再侵入すると速く強い二次応答が起こる。'],

 ['ある動物の抗体遺伝子で、H鎖の可変部はV断片40種・D断片25種・J断片6種から、L鎖の可変部はV断片40種・J断片5種から1つずつ選ばれて再構成される。H鎖とL鎖の組み合わせで生じうる抗体の可変部は何通りか（その他の多様化は考えない）。', ['120万通り','6200通り','6000通り','24万通り'], 'H鎖 40×25×6＝6000通り、L鎖 40×5＝200通り。抗体はH鎖とL鎖の組み合わせなので6000×200＝120万通り（利根川進の研究）。', 4],

 ['肺胞で酸素ヘモグロビンの割合が96％、ある組織で36％だった。肺で酸素と結合していたヘモグロビンのうち、組織で酸素を離したものの割合はおよそ何％か。', ['約63％','約60％','約38％','約96％'], '(96−36)÷96＝0.625で約63％。「全ヘモグロビンのうち」なら60％になるので、何に対する割合かに注意。', 3],

function rng(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hash(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function shuffle(arr, r = Math.random){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pct = (c, t) => t ? Math.round(c / t * 100) : null;

/* ---------- 記録 ---------- */
let ST = LS.get('bio-stats', {q:{}});
if (!ST || typeof ST.q !== 'object') ST = {q:{}};
function normST(){
  if (!ST.f || typeof ST.f !== 'object') ST.f = {}; // 各問題の「初めて解いたときの結果」 1=正解 0=不正解
  for (const [k, s] of Object.entries(ST.q)) if (!(k in ST.f) && Array.isArray(s) && s[1] === 1) ST.f[k] = s[0] ? 1 : 0;
}
normST();
let dbDoc = null, saving = false, dirty = false, saveTimer = null, synced = false;
function record(id, ok){
  if (!QMAP[id]) return;
  const s = ST.q[id] || [0, 0, 0];
  ST.q[id] = [s[0] + (ok ? 1 : 0), s[1] + 1, ok ? 0 : 1]; // [正解数, 回答数, 直近が不正解なら1]
  if (!(id in ST.f)) { ST.f[id] = ok ? 1 : 0; AG.dirty = true; }
  LS.set('bio-stats', ST); queueSave();
}
function queueSave(){ dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 1500); }
async function flush(){
  if (!dbDoc || saving || !dirty) return;
  saving = true; dirty = false;
  try { await dbDoc.set({q: ST.q, f: ST.f, aggKey: AG.key, at: Date.now()}); } catch(e){ dirty = true; }
  saving = false;
  if (dirty) { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 5000); }
  flushAgg();
}

/* ---------- みんなの正答率から難易度を自動判定 ---------- */
// 各人は、ランダムな匿名キーの文書 agg/<キー> に「初回の正誤」だけを書く。名前やアカウントIDは載せない。
// 全員の文書を合計し、AUTO_MIN人以上が解いた問題は初回正答率で難易度を付け直す。
const AUTO_MIN = 5, AUTO_HI = 0.8, AUTO_LO = 0.5;
const AG = {key: null, doc: null, dirty: false, saving: false, stats: {}, people: 0};
const newKey = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, '0')).join('');
async function flushAgg(){
  if (!AG.doc || AG.saving || !AG.dirty) return;
  AG.saving = true; AG.dirty = false;
  try { await AG.doc.set({f: ST.f, at: Date.now()}); } catch(e){ AG.dirty = true; }
  AG.saving = false;
}
function setAgg(docs){
  const st = {}; let people = 0;
  for (const d of docs){
    const f = (d.data() || {}).f; if (!f || typeof f !== 'object') continue;
    let any = false;
    for (const [id, v] of Object.entries(f)){
      if (!QMAP[id] && !id.startsWith('p_')) continue;
      if (v !== 0 && v !== 1) continue;
      const s = st[id] || (st[id] = {n: 0, k: 0}); s.n++; s.k += v; any = true;
    }
    if (any) people++;
  }
  AG.stats = st; AG.people = people;
  applyAuto(); rerenderIdle();
}
function applyAuto(){
  for (const q of QS){
    if (q.lv0 == null) q.lv0 = q.lv;
    const s = AG.stats[q.id];
    if (q.lv0 === 4) { q.lv = 4; q.auto = false; continue; }
    if (s && s.n >= AUTO_MIN){ const p = s.k / s.n; q.lv = p >= AUTO_HI ? 1 : p >= AUTO_LO ? 2 : 3; q.auto = true; }
    else { q.lv = q.lv0; q.auto = false; }
  }
}
function crowdLine(q){
  const s = AG.stats[q.id]; if (!s || !s.n) return '';
  return `<small class="crowd">みんなの初回正答率 ${Math.round(s.k / s.n * 100)}%（${s.n}人）${q.auto ? '・難易度はこの正答率で判定' : ''}</small>`;
}

    const remote = body.q || {};
    let changed = false;
    for (const [k, v] of Object.entries(remote)){
      if (!Array.isArray(v)) continue;
      const l = ST.q[k];
      if (!l || v[1] > l[1]) ST.q[k] = v.slice();
      else if (l[1] > v[1]) changed = true;
    }
    for (const k of Object.keys(ST.q)) if (!remote[k]) changed = true;
    const rf = body.f && typeof body.f === 'object' ? body.f : {};
    for (const [k, v] of Object.entries(rf)) if (!(k in ST.f) && (v === 0 || v === 1)) ST.f[k] = v;
    for (const k of Object.keys(ST.f)) if (!(k in rf)) changed = true;
    normST();
    AG.key = typeof body.aggKey === 'string' && /^[0-9a-f]{24}$/.test(body.aggKey) ? body.aggKey : newKey();
    if (AG.key !== body.aggKey) changed = true;
    AG.doc = db.collection('agg').doc(AG.key);
    AG.dirty = Object.keys(ST.f).length > 0;
    LS.set('bio-stats', ST); synced = true;
    if (changed) queueSave(); else flushAgg();
  } catch(e){ dbDoc = null; }

const clip = (s, n) => String(s ?? '').trim().slice(0, n);
function setPhotoQs(docs){
  for (let i = QS.length - 1; i >= 0; i--) if (QS[i].f === 'zpho'){ delete QMAP[QS[i].id]; QS.splice(i, 1); }
  const rows = docs.map(d => [d, d.data() || {}]).sort((a, b) => (a[1].at || 0) - (b[1].at || 0));
  for (const [d, x] of rows){
    const ch = Array.isArray(x.ch) ? x.ch.map(c => clip(c, 60)) : [];
    if (!ASSET_RE.test(String(x.img)) || ch.length !== 4 || ch.some(c => !c)) continue;
    const o = {id: 'p_' + d.id, f: 'zpho', g: 'zatsu', lv: [1,2,3].includes(x.lv) ? x.lv : 2, q: clip(x.q, 120) || 'この生き物の名前は？', ch, ex: clip(x.ex, 400), img: x.img, doc: d.id, by: x.by || null};
    QS.push(o); QMAP[o.id] = o;
  }

}
const imgHTML = q => q.img && ASSET_RE.test(q.img) ? `<figure class="qimg"><img src="${blobSrc(q.img)}" data-blob="${q.img}" alt="問題の写真" loading="eager"></figure>` : '';
async function shrink(file){
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), 'image/jpeg', 0.85));
  } catch(e){ return file; }
}

function fieldStats(k){
  const qs = QS.filter(q => q.f === k);
  let c = 0, t = 0, seen = 0, mastered = 0;
  for (const q of qs){ const s = ST.q[q.id]; if (s && s[1]){ c += s[0]; t += s[1]; seen++; if (!s[2]) mastered++; } }
  return {n: qs.length, c, t, seen, mastered};
}

function pickQuestions(pool, n){
  let list = shuffle(pool);
  if (P.order === 'weak'){
    const key = q => { const s = ST.q[q.id]; if (!s || !s[1]) return 0.55; return s[0] / s[1] - (s[2] ? 0.3 : 0); };
    list = list.map(q => [q, key(q) + Math.random() * 0.05]).sort((a, b) => a[1] - b[1]).map(x => x[0]);
  } else if (P.order === 'new'){
    const seen = q => (ST.q[q.id] && ST.q[q.id][1]) ? 1 : 0;
    list = list.map(q => [q, seen(q)]).sort((a, b) => a[1] - b[1]).map(x => x[0]);
  }
  return shuffle(list.slice(0, n));
}

/* ---------- 練習：出題 ---------- */
let Z = null; // {list, i, perm, picked, results:[]}
function startQuiz(qs){ Z = {list: qs.map(q => q.id), i: 0, perm: shuffle([0,1,2,3]), picked: null, results: []}; window.scrollTo(0, 0); renderQuiz(); }
function choiceButtons(q, perm, picked, reveal){
  return perm.map((ci, pos) => {
    let cls = '';
    if (reveal){ if (ci === 0) cls = 'ok'; else if (ci === picked) cls = 'ng'; else cls = 'dim'; }
    else if (picked === ci) cls = 'picked';
    return `<button class="ch ${cls}" data-c="${ci}" ${reveal || picked != null ? 'disabled' : ''}><span class="mk">${MK[pos]}</span><span>${esc(q.ch[ci])}</span></button>`;
  }).join('');
}
function renderQuiz(){
  if (Z.i >= Z.list.length) return renderResult();
  const q = QMAP[Z.list[Z.i]], f = FMAP[q.f], done = Z.picked != null;
  view.innerHTML = `<div class="stack">
    <div class="sect">
      <div class="qhead"><span class="tag">${esc(f.n)}<span class="st">${stars(q.lv)}</span></span><span class="num">${Z.i + 1} / ${Z.list.length}</span></div>
      <div class="bar"><i style="width:${(Z.i + (done ? 1 : 0)) / Z.list.length * 100}%"></i></div>
    </div>
    ${imgHTML(q)}
    <p class="qtext">${esc(q.q)}</p>
    <div class="choices">${choiceButtons(q, Z.perm, Z.picked, done)}</div>
    ${done ? `<div class="exp ${Z.picked === 0 ? 'ok' : 'ng'}"><b>${Z.picked === 0 ? '正解' : '不正解　正解は ' + MK[Z.perm.indexOf(0)]}</b><span>${esc(q.ex)}</span>${crowdLine(q)}</div>
      <button class="primary" id="next">${Z.i + 1 < Z.list.length ? '次の問題へ' : '結果を見る'}</button>` : ''}
    <button class="ghost" id="quit">練習をやめる</button>
  </div>`;
  view.querySelectorAll('.ch').forEach(b => b.onclick = () => {
    if (Z.picked != null) return;
    Z.picked = +b.dataset.c; const ok = Z.picked === 0;
    record(q.id, ok); Z.results.push({id: q.id, ok, picked: Z.picked});
    renderQuiz();
    const n = $('#next'); if (n) n.scrollIntoView({block: 'nearest', behavior: 'smooth'});
  });
  if (done) $('#next').onclick = () => { Z.i++; Z.picked = null; Z.perm = shuffle([0,1,2,3]); window.scrollTo(0, 0); renderQuiz(); };
  $('#quit').onclick = () => { Z.results.length ? (Z.list = Z.list.slice(0, Z.results.length), Z.i = Z.list.length, renderQuiz()) : (Z = null, renderSetup()); };
}
function renderResult(){
  const ok = Z.results.filter(r => r.ok).length, n = Z.results.length;
  const wrong = Z.results.filter(r => !r.ok);
  view.innerHTML = `<div class="stack">
    <div class="card sect">
      <h2>結果</h2>
      <div class="big">${ok}<small>/ ${n}問 正解（${pct(ok, n) ?? 0}%）</small></div>
    </div>
    ${wrong.length ? `<div class="card wrong"><h2>間違えた問題</h2><ul>${wrong.map(r => { const q = QMAP[r.id];
      return `<li>${q.img ? `<img class="thumb" src="${blobSrc(q.img)}" data-blob="${q.img}" alt="">` : ''}<div>${esc(q.q)}</div><div class="ans">正解：${esc(q.ch[0])}</div><div class="note">${esc(q.ex)}</div></li>`; }).join('')}</ul></div>` : `<p class="note">全問正解です。</p>`}
    ${wrong.length ? `<button class="primary" id="retry">間違えた${wrong.length}問をもう一度</button>` : ''}
    <button class="secondary" id="back">設定にもどる</button>
  </div>`;
  if (wrong.length) $('#retry').onclick = () => startQuiz(shuffle(wrong.map(r => QMAP[r.id])));
  $('#back').onclick = () => { Z = null; window.scrollTo(0, 0); renderSetup(); };
}

/* ---------- 記録 ---------- */
let confirmReset = false;
function renderStats(){
  let c = 0, t = 0, seen = 0;
  for (const q of QS){ const s = ST.q[q.id]; if (s && s[1]){ c += s[0]; t += s[1]; seen++; } }
  const weak = QS.map(q => [q, ST.q[q.id]]).filter(([, s]) => s && s[1] && s[0] < s[1])
    .sort((a, b) => (a[1][0] / a[1][1]) - (b[1][0] / b[1][1]) || b[1][1] - a[1][1]).slice(0, 8);
  view.innerHTML = `<div class="stack">
    <div class="kpis">
      <div class="kpi"><b>${pct(c, t) == null ? '—' : pct(c, t) + '%'}</b><span>全体の正答率</span></div>
      <div class="kpi"><b>${t}</b><span>のべ回答数</span></div>

      <h2>難易度別の正答率</h2>

      <div class="lvkpi" style="grid-template-columns:repeat(${LEVELS().length},1fr)">${LEVELS().map(v => { let c2 = 0, t2 = 0; for (const q of QS) if (q.lv === v){ const s = ST.q[q.id]; if (s){ c2 += s[0]; t2 += s[1]; } } const p = pct(c2, t2);
        return `<div><span class="st">${stars(v)}</span><b class="${p != null && p < 60 ? 'low' : ''}">${p == null ? '—' : p + '%'}</b><span>${LVN[v]}・のべ${t2}回</span></div>`; }).join('')}</div>
    </section>
    ${COURSES.map(cs => `<section class="card sect">
      <h2>${esc(cs.n)}・分野別の正答率</h2>
      <div>${FIELDS.filter(f => f.g === cs.k).map(f => { const s = fieldStats(f.k); const p = pct(s.c, s.t);
        return `<div class="frow"><div class="nm">${esc(f.n)}<small>${esc(f.c)}</small></div><div class="pc ${p != null && p < 60 ? 'low' : ''}">${p == null ? '—' : p + '%'}</div>
        <div class="meter" title="直近で正解した問題／解いた問題"><i class="a" style="width:${s.n ? s.mastered / s.n * 100 : 0}%"></i><i class="b" style="width:${s.n ? (s.seen - s.mastered) / s.n * 100 : 0}%"></i></div>
        <div class="sub">解いた問題 ${s.seen}/${s.n}・直近で正解 ${s.mastered}問・のべ ${s.t}回</div></div>`; }).join('')}</div>
    </section>`).join('')}
    <p class="note">バーの濃い部分は直近の回答で正解した問題、薄い部分は直近で間違えた問題です。</p>
    <section class="card sect">
      <h2>苦手な問題</h2>
      ${weak.length ? `<div class="wrong"><ul>${weak.map(([q, s]) => `<li><div>${esc(q.q)}</div><div class="note">${esc(FMAP[q.f].n)}・${s[0]}/${s[1]}回正解</div></li>`).join('')}</ul></div>
        <button class="primary" id="drill">この${weak.length}問を練習する</button>` : `<p class="note">間違えた問題はまだありません。練習すると、ここに苦手な問題が並びます。</p>`}
    </section>
    <div class="sect">
      <div class="sync ${dbDoc && !SITE ? 'on' : ''}">${TXT.sync(!!dbDoc)}</div>
      ${SITE && PH.me ? `<p class="note">管理者設定用のID：<code style="user-select:all;font-family:var(--f-num)">${esc(PH.me)}</code></p>` : ''}
      ${confirmReset ? `<div class="confirm"><span>記録をすべて消しますか？</span><button class="danger" id="rsYes">消す</button><button id="rsNo">やめる</button></div>`
        : `<div><button class="ghost" id="rs" style="padding-left:0">記録をリセット</button></div>`}
    </div>
  </div>`;
  if (weak.length) $('#drill').onclick = () => { tab = 'practice'; syncTabs(); startQuiz(shuffle(weak.map(w => w[0]))); };
  if (confirmReset){ $('#rsYes').onclick = () => { ST = {q:{}, f: ST.f}; LS.set('bio-stats', ST); queueSave(); confirmReset = false; renderStats(); }; $('#rsNo').onclick = () => { confirmReset = false; renderStats(); }; }
  else $('#rs').onclick = () => { confirmReset = true; renderStats(); };
}
function syncTabs(){ document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', x.dataset.tab === tab)); }

/* ---------- 対戦 ---------- */
// 仕組み：名前付きルーム「bio-番号」に入り、ホストが自分のpresenceに試合状態を載せる。参加者は自分のpresenceに回答を載せる。
const B = {room: undefined, rm: null, role: null, code: '', name: LS.get('bio-name', ''), g: null, myKey: null, myAns: null, localStart: 0, recorded: new Set(), err: '', busy: false, hostSeen: false, joinedAt: 0, unsub: null};
const H = {set: Object.assign({fields: ALLF, course: 'exam', lv: [1,2,3], n: 10, lim: 15}, LS.get('bio-battle', {})), qids: [], qStart: 0, ans: new Map(), timer: null};
if (Array.isArray(H.set.f)) { H.set.fields = H.set.f; delete H.set.f; }
normSel(H.set);
const saveH = () => LS.set('bio-battle', H.set);
const cleanName = s => { let o = ''; for (const ch of String(s ?? '')) { const c = ch.codePointAt(0); if (c < 32 || (c >= 127 && c < 160) || (c >= 0x200b && c <= 0x200f) || (c >= 0x2028 && c <= 0x202e) || (c >= 0x2060 && c <= 0x206f) || c === 0xfeff) continue; o += ch; } o = o.trim(); return [...o].slice(0, 12).join('') || '名無し'; };
const myPeer = () => { const me = B.rm && B.rm.peers().find(p => p.sameTab); return me ? me.peer : 'me'; };
const curKey = () => B.g ? B.g.ep + '.' + B.g.i : '';
const BONUS = [5, 3, 1];

async function ensureRoom(){ if (B.room === undefined) B.room = await use('room'); return B.room; }
function needName(){ const v = cleanName($('#bName') && $('#bName').value); if (!$('#bName').value.trim()){ B.err = '名前を入力してください'; renderBattle(); return null; } B.name = v; LS.set('bio-name', v); return v; }
async function createRoom(){
  if (!needName()) return;
  B.busy = true; B.err = ''; renderBattle();
  const room = await ensureRoom();
  if (!room){ B.busy = false; B.err = TXT.noRoom; return renderBattle(); }
  const code = String(1000 + Math.floor(Math.random() * 9000));
  try { B.rm = await room.join('bio-' + code); } catch(e){ B.busy = false; B.err = '部屋を作れませんでした（' + (e && e.code || 'error') + '）。少し待ってもう一度試してください。'; return renderBattle(); }
  B.role = 'h'; B.code = code; B.busy = false;
  B.g = {ep: 0, ph: 'lobby', i: 0, n: H.set.n, lim: H.set.lim, q: null, sd: 0, ac: 0, np: 1, sc: {}, res: null};
  B.unsub = B.rm.onPeers(hostPeers);
  pushHost(); renderBattle();
}
async function joinRoom(){
  if (!needName()) return;
  const code = ($('#bCode').value || '').replace(/\D/g, '');
  if (!/^\d{4}$/.test(code)){ B.err = '4けたの部屋番号を入力してください'; return renderBattle(); }
  B.busy = true; B.err = ''; renderBattle();
  const room = await ensureRoom();
  if (!room){ B.busy = false; B.err = TXT.noRoom; return renderBattle(); }
  try { B.rm = await room.join('bio-' + code); } catch(e){ B.busy = false; B.err = '部屋に入れませんでした（' + (e && e.code || 'error') + '）'; return renderBattle(); }
  B.role = 'p'; B.code = code; B.busy = false; B.g = null; B.hostSeen = false; B.joinedAt = Date.now();
  B.rm.presence({r: 'p', n: B.name}).catch(() => {});
  B.unsub = B.rm.onPeers(playerPeers);
  setTimeout(() => { if (B.role === 'p' && !B.hostSeen) renderBattle(); }, 4000);
  renderBattle();
}
async function leaveRoom(){
  clearInterval(H.timer);
  try { B.unsub && B.unsub(); } catch(e){}
  try { B.rm && await B.rm.leave(); } catch(e){}
  Object.assign(B, {rm: null, role: null, code: '', g: null, myKey: null, myAns: null, err: '', unsub: null});
  renderBattle();
}
function pushHost(){ if (B.rm) B.rm.presence({r: 'h', n: B.name, g: B.g}).catch(e => { B.err = '通信エラー：' + (e && e.code || ''); }); }
function roomPlayers(){ // ホスト以外の、いまルームにいる参加者
  return B.rm ? B.rm.peers().filter(p => !p.sameTab && p.presence && p.presence.r === 'p') : [];
}
function activeCount(){ return 1 + roomPlayers().length; }

// --- ホスト側
function hostPeers(){
  if (B.role !== 'h') return;
  const g = B.g; let changed = false;
  const me = myPeer();
  if (me !== 'me' && g.sc.me) { delete g.sc.me; changed = true; }
  if (!g.sc[me]) { g.sc[me] = [B.name, 0]; changed = true; }
  for (const p of roomPlayers()){
    const pr = p.presence, nm = cleanName(pr.n);
    if (!g.sc[p.peer]) { g.sc[p.peer] = [nm, 0]; changed = true; }
    else if (g.sc[p.peer][0] !== nm) { g.sc[p.peer][0] = nm; changed = true; }
    if (g.ph === 'q' && pr.a && pr.a.k === curKey() && !H.ans.has(p.peer)){
      const c = Number(pr.a.c);
      if (Number.isInteger(c) && c >= 0 && c < 4){ H.ans.set(p.peer, {c, ms: Date.now() - H.qStart}); changed = true; }
    }
  }
  // 参加者が多すぎるときは記録を絞る（presenceの容量対策）
  const keys = Object.keys(g.sc); if (keys.length > 30) for (const k of keys.slice(0, keys.length - 30)) delete g.sc[k];
  if (g.ph === 'q'){
    const np = activeCount();
    if (g.ac !== H.ans.size || g.np !== np){ g.ac = H.ans.size; g.np = np; changed = true; }
    if (H.ans.size >= np) return reveal();
  }
  if (changed) pushHost();
  if (tab === 'battle') renderBattle();
}
function startGame(){
  const pool = poolFor(H.set);
  if (!pool.length) return;
  H.qids = shuffle(pool).slice(0, Math.min(H.set.n, pool.length)).map(q => q.id);
  const g = B.g;
  g.ep = 1 + Math.floor(Math.random() * 1e9); g.n = H.qids.length; g.lim = H.set.lim;
  for (const k of Object.keys(g.sc)) g.sc[k][1] = 0;
  const live = new Set([myPeer(), ...roomPlayers().map(p => p.peer)]);
  for (const k of Object.keys(g.sc)) if (!live.has(k)) delete g.sc[k];
  nextQ(0);
}
function nextQ(i){
  const g = B.g;
  Object.assign(g, {ph: 'q', i, q: H.qids[i], sd: Math.floor(Math.random() * 1e9), ac: 0, np: activeCount(), res: null});
  H.ans.clear(); H.qStart = Date.now(); B.myAns = null; B.myKey = curKey(); B.localStart = H.qStart;
  pushHost();
  clearInterval(H.timer);
  H.timer = setInterval(() => { if (B.g && B.g.ph === 'q' && Date.now() - H.qStart > B.g.lim * 1000 + 600) reveal(); }, 250);
  window.scrollTo(0, 0); renderBattle();
}
function hostAnswer(c){
  if (B.g.ph !== 'q' || B.myAns != null) return;
  const me = myPeer(); B.myAns = c;
  H.ans.set(me, {c, ms: Date.now() - H.qStart});
  B.g.ac = H.ans.size;
  if (H.ans.size >= activeCount()) return reveal();
  pushHost(); renderBattle();
}
function reveal(){
  clearInterval(H.timer);
  const g = B.g; if (g.ph !== 'q') return;
  const entries = [...H.ans.entries()].map(([peer, a]) => ({peer, c: a.c, ms: a.ms}));
  const correct = entries.filter(e => e.c === 0).sort((a, b) => a.ms - b.ms);
  correct.forEach((e, r) => e.pts = 10 + (BONUS[r] || 0));
  entries.filter(e => e.c !== 0).forEach(e => e.pts = 0);
  for (const e of entries) if (g.sc[e.peer]) g.sc[e.peer][1] += e.pts;
  const live = [myPeer(), ...roomPlayers().map(p => p.peer)];
  const none = live.filter(p => !H.ans.has(p)).map(peer => ({peer, c: -1, ms: 0, pts: 0}));
  const wrong = entries.filter(e => e.c !== 0).sort((a, b) => a.ms - b.ms);
  g.res = [...correct, ...wrong, ...none].slice(0, 24).map(e => [e.peer, g.sc[e.peer] ? g.sc[e.peer][0] : '？', e.c, e.ms, e.pts]);
  g.ph = 'rev';
  if (B.myAns != null && !B.recorded.has(curKey())){ B.recorded.add(curKey()); record(g.q, B.myAns === 0); }
  pushHost(); renderBattle();
}
function hostNext(){ const g = B.g; if (g.i + 1 < g.n) nextQ(g.i + 1); else { g.ph = 'end'; pushHost(); renderBattle(); } }
function hostLobby(){ Object.assign(B.g, {ph: 'lobby', res: null, q: null}); pushHost(); renderBattle(); }

// --- 参加者側
function playerPeers(){
  if (B.role !== 'p') return;
  const h = B.rm.peers().find(p => !p.sameTab && p.presence && p.presence.r === 'h');
  const g = h && h.presence.g && typeof h.presence.g === 'object' ? h.presence.g : null;
  if (h) B.hostSeen = true;
  B.hostName = h ? cleanName(h.presence.n) : '';
  if (g){
    const k = g.ep + '.' + g.i;
    if (g.ph === 'q' && B.myKey !== k){ B.myKey = k; B.myAns = null; B.localStart = Date.now(); if (tab === 'battle') window.scrollTo(0, 0); }
    if (g.ph === 'rev' && B.myKey === k && B.myAns != null && !B.recorded.has(k) && QMAP[g.q]){ B.recorded.add(k); record(g.q, B.myAns === 0); }
  }
  B.g = g;
  if (tab === 'battle') renderBattle();
}
function playerAnswer(c){
  if (!B.g || B.g.ph !== 'q' || B.myAns != null) return;
  if (Date.now() - B.localStart > B.g.lim * 1000) return;
  B.myAns = c;
  B.rm.presence({a: {k: B.myKey, c}}).catch(() => {});
  renderBattle();
}

// --- 対戦画面
setInterval(() => {
  const bar = $('#tbar'); if (!bar || !B.g || B.g.ph !== 'q') return;
  const start = B.role === 'h' ? H.qStart : B.localStart;
  const left = Math.max(0, B.g.lim * 1000 - (Date.now() - start));
  bar.style.width = (left / (B.g.lim * 1000) * 100) + '%';
  const tl = $('#tleft'); if (tl) tl.textContent = Math.ceil(left / 1000) + '秒';
  if (left <= 0 && B.role === 'p' && B.myAns == null){ const w = $('#bwait'); if (w) w.textContent = '時間切れ。答え合わせを待っています'; view.querySelectorAll('.ch').forEach(b => b.disabled = true); }
}, 200);

function peopleList(){
  if (!B.rm) return '';
  const ps = B.rm.peers().filter(p => p.presence && (p.presence.r === 'h' || p.presence.r === 'p'));
  ps.sort((a, b) => (a.presence.r === 'h' ? -1 : 0) - (b.presence.r === 'h' ? -1 : 0));
  return `<ul class="players">${ps.map(p => `<li class="${p.presence.r === 'h' ? 'host' : ''}">${esc(cleanName(p.presence.n))}${p.presence.r === 'h' ? '<em>ホスト</em>' : ''}${p.sameTab ? '<em>あなた</em>' : ''}</li>`).join('')}</ul>`;
}
function scoreboard(g, title){
  const me = myPeer();
  const rows = Object.entries(g.sc || {}).map(([peer, v]) => ({peer, name: v[0], pts: v[1]})).sort((a, b) => b.pts - a.pts);
  let pos = 0, last = null;
  return `<section class="card sect"><h2>${title}</h2><ol class="rank">${rows.map((r, i) => { if (r.pts !== last){ pos = i + 1; last = r.pts; }
    return `<li class="${r.peer === me ? 'me' : ''}"><span class="pos">${pos}</span><span class="who">${esc(cleanName(r.name))}</span><span></span><span class="pt">${r.pts}点</span></li>`; }).join('')}</ol></section>`;
}
function renderBattle(){
  if (!B.role) return renderBattleEntry();
  const g = B.g, isHost = B.role === 'h';
  const head = `<div class="codebox"><span>部屋番号</span><b>${esc(B.code)}</b></div>`;
  const leave = `<button class="ghost" id="bLeave">部屋から出る</button>`;
  let body = '';
  if (!g){
    const late = Date.now() - B.joinedAt > 3500;
    body = `<p class="waiting">${late ? 'ホストが見つかりません。部屋番号が合っているか、ホストが部屋を開いたままか確認してください。' : 'ホストにつないでいます…'}</p>`;
  } else if (g.ph === 'lobby'){
    if (isHost){
      const pool = poolFor(H.set).length;
      body = `<section class="sect"><h2>参加者（${activeCount()}人）</h2>${peopleList()}<p class="note">友だちに部屋番号を伝えて、このページの「対戦」から参加してもらいます。</p></section>
      ${selUI(H.set, false)}
      <section class="sect"><h2>問題数</h2><div class="seg" id="hN">${[5,10,15,20].map(v => `<button data-v="${v}" aria-pressed="${H.set.n === v}">${v}問</button>`).join('')}</div></section>
      <section class="sect"><h2>制限時間（1問）</h2><div class="seg" id="hL">${[10,15,20,30].map(v => `<button data-v="${v}" aria-pressed="${H.set.lim === v}">${v}秒</button>`).join('')}</div></section>
      <p class="note">得点：正解 10点＋早押しボーナス（1着 +5、2着 +3、3着 +1）。不正解・時間切れは0点。</p>
      <button class="primary" id="hStart" ${pool ? '' : 'disabled'}>対戦スタート</button>`;
    } else {
      body = `<section class="sect"><h2>参加者</h2>${peopleList()}</section><p class="waiting">${esc(B.hostName || 'ホスト')}さんが始めるのを待っています</p>`;
    }
  } else if ((g.ph === 'q' || g.ph === 'rev') && QMAP[g.q]){
    const q = QMAP[g.q], perm = shuffle([0,1,2,3], rng((g.sd ^ hash(g.q)) >>> 0));
    const rev = g.ph === 'rev';
    const myPick = (B.myKey === curKeyOf(g)) ? B.myAns : null;
    body = `<div class="sect"><div class="qhead"><span class="tag">${esc(FMAP[q.f].n)}<span class="st">${stars(q.lv)}</span></span><span class="num">第${g.i + 1}問 / ${g.n}${rev ? '' : '　<span id="tleft"></span>'}</span></div>
      ${rev ? '' : '<div class="bar timer"><i id="tbar" style="width:100%"></i></div>'}</div>
      ${imgHTML(q)}
      <p class="qtext">${esc(q.q)}</p>
      <div class="choices">${choiceButtons(q, perm, myPick, rev)}</div>`;
    if (!rev){
      body += `<p class="waiting" id="bwait">${myPick != null ? `回答しました。ほかの人を待っています（${g.ac}/${g.np}人）` : `${g.ac}/${g.np}人が回答済み`}</p>`;
    } else {
      const me = myPeer();
      body += `<div class="exp ${myPick === 0 ? 'ok' : 'ng'}"><b>${myPick === 0 ? '正解' : myPick == null ? '時間切れ' : '不正解'}　正解は ${MK[perm.indexOf(0)]}</b><span>${esc(q.ex)}</span>${crowdLine(q)}</div>
      <section class="card sect"><h2>この問題の順位</h2><ol class="rank">${(g.res || []).map((r, i) => `<li class="${r[0] === me ? 'me' : ''}"><span class="pos">${r[2] === 0 ? i + 1 : '–'}</span><span class="who"><span class="mark ${r[2] === 0 ? 'o' : 'x'}">${r[2] === 0 ? '○' : r[2] < 0 ? '—' : '×'}</span>${esc(cleanName(r[1]))}</span><span class="t">${r[2] >= 0 ? (r[3] / 1000).toFixed(2) + '秒' : ''}</span><span class="pt">+${r[4]}</span></li>`).join('')}</ol></section>
      ${scoreboard(g, '現在の得点')}
      ${isHost ? `<button class="primary" id="hNext">${g.i + 1 < g.n ? '次の問題へ' : '結果発表'}</button>` : `<p class="waiting">ホストが次へ進むのを待っています</p>`}`;
    }
  } else if (g.ph === 'end'){
    const rows = Object.values(g.sc || {}).sort((a, b) => b[1] - a[1]);
    const top = rows[0];
    body = `<div class="card sect podium"><h2>優勝</h2><div class="big">${esc(top ? cleanName(top[0]) : '—')}</div><p class="note">${top ? top[1] + '点' : ''}</p></div>
      ${scoreboard(g, '最終結果')}
      ${isHost ? `<button class="primary" id="hLobby">もう一度あそぶ</button>` : `<p class="waiting">ホストが次の対戦を準備するのを待っています</p>`}`;
  } else {
    body = `<p class="waiting">読み込み中…</p>`;
  }
  view.innerHTML = `<div class="stack">${head}${B.err ? `<p class="err">${esc(B.err)}</p>` : ''}${body}${leave}</div>`;
  $('#bLeave').onclick = leaveRoom;
  view.querySelectorAll('.ch').forEach(b => b.onclick = () => (isHost ? hostAnswer : playerAnswer)(+b.dataset.c));
  if (isHost){
    if (g && g.ph === 'lobby') bindSel(H.set, saveH, renderBattle);
    view.querySelectorAll('#hN button').forEach(b => b.onclick = () => { H.set.n = +b.dataset.v; saveH(); renderBattle(); });
    view.querySelectorAll('#hL button').forEach(b => b.onclick = () => { H.set.lim = +b.dataset.v; saveH(); renderBattle(); });
    const s = $('#hStart'); if (s) s.onclick = startGame;
    const n = $('#hNext'); if (n) n.onclick = hostNext;
    const l = $('#hLobby'); if (l) l.onclick = hostLobby;
  }
}
const curKeyOf = g => g.ep + '.' + g.i;
function renderBattleEntry(){
  view.innerHTML = `<div class="stack">
    <div class="card sect">
      <h2>早押し対戦</h2>
      <p class="note" style="font-size:.88rem;color:var(--ink)">同じ問題に全員で同時に答え、正解の早さを競います。1人が部屋を作り、ほかの人は4けたの部屋番号で参加します。</p>
    </div>
    <div class="field"><label for="bName">あなたの名前（12文字まで）</label><input type="text" id="bName" maxlength="12" value="${esc(B.name)}" placeholder="例：まさや" autocomplete="nickname"></div>
    ${B.err ? `<p class="err">${esc(B.err)}</p>` : ''}
    <button class="primary" id="bCreate" ${B.busy ? 'disabled' : ''}>部屋を作る（ホストになる）</button>
    <div class="or">または</div>
    <div class="field"><label for="bCode">部屋番号で参加</label>
      <div class="joinrow"><input id="bCode" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="4けたの番号"><button id="bJoin" ${B.busy ? 'disabled' : ''}>参加</button></div></div>
    <p class="note">${TXT.entry}</p>
  </div>`;
  $('#bCreate').onclick = createRoom;
  $('#bJoin').onclick = joinRoom;
  $('#bCode').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(); });
}

render();
</script>

</body>
</html>
